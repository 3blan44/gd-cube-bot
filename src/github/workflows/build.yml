name: Build Geode Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build with Geode
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cube-bot-geode
          path: build/*.geode
